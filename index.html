<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUMA — источник кофе | Новый Хушет, ул. Садовая 62</title>
  <meta name="description" content="Кофейня RUMA в Новом Хушете — специальный кофе, завтраки, боулы и лимонады. ул. Садовая 62.">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ШАПКА -->
  <header class="topbar">
    <a href="#top" class="topbar__brand">RUMA</a>
    <nav class="topbar__nav">
      <a href="#menu">Меню</a>
      <a href="#reviews">Отзывы</a>
      <a href="#contacts">Контакты</a>
    </nav>
  </header>

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <section class="hero" id="top">
    <img class="hero__logo" src="img/logo-cream.png" alt="RUMA — источник кофе">
    <p class="hero__address">Новый Хушет&nbsp;· ул.&nbsp;Садовая&nbsp;62</p>
    <div class="hero__actions">
      <a class="btn btn--light" href="#menu">Смотреть меню</a>
      <a class="btn btn--ghost" href="https://yandex.ru/maps/org/ruma/74698574630/" target="_blank" rel="noopener">Как добраться</a>
    </div>
  </section>

  <!-- МЕНЮ -->
  <section class="menu" id="menu">
    <div class="container">
      <h2 class="section-title">Меню</h2>

      <div class="menu__tabs" role="tablist">
        <button class="tab is-active" data-tab="drinks" role="tab" aria-selected="true">Напитки</button>
        <button class="tab" data-tab="food" role="tab" aria-selected="false">Завтраки и кухня</button>
      </div>

      <div class="menu__panel" id="menu-panel">
        <!-- категории рендерятся из js/menu.js -->
      </div>
    </div>
  </section>

  <!-- ОТЗЫВЫ -->
  <section class="reviews" id="reviews">
    <div class="container">
      <h2 class="section-title section-title--light">Отзывы</h2>

      <div class="reviews__ratings">
        <a class="rating-badge" href="https://yandex.ru/maps/org/ruma/74698574630/" target="_blank" rel="noopener">
          <span class="rating-badge__score">4,4</span>
          <span class="rating-badge__src">Яндекс Карты</span>
        </a>
        <a class="rating-badge" href="https://2gis.ru/makhachkala/firm/70000001103341689/tab/reviews" target="_blank" rel="noopener">
          <span class="rating-badge__score">4,8</span>
          <span class="rating-badge__src">2ГИС</span>
        </a>
      </div>

      <div class="reviews__grid">
        <figure class="review">
          <blockquote>«Прекрасное место! Бариста делает очень хорошее и правильное эспрессо. Отличные завтраки и атмосфера»</blockquote>
          <figcaption>Фатима Б. · Яндекс Карты</figcaption>
        </figure>
        <figure class="review">
          <blockquote>«Очень вкусная еда и кофе, и цены не высокие»</blockquote>
          <figcaption>Хищник М · 2ГИС</figcaption>
        </figure>
        <figure class="review">
          <blockquote>«Всё очень вкусно. Красивый интерьер. Кухня топовая»</blockquote>
          <figcaption>Хан · Яндекс Карты</figcaption>
        </figure>
        <figure class="review">
          <blockquote>«Уютная атмосфера, отличный сбалансированный кофе, свежие десерты и внимательный персонал»</blockquote>
          <figcaption>Магомед Х. · 2ГИС</figcaption>
        </figure>
        <figure class="review">
          <blockquote>«Очень классное, тихое и уютное место, а какая вкусная еда»</blockquote>
          <figcaption>m m · 2ГИС</figcaption>
        </figure>
        <figure class="review">
          <blockquote>«Лучший айс кофе тут»</blockquote>
          <figcaption>Критик Хушетский · 2ГИС</figcaption>
        </figure>
      </div>
    </div>
  </section>

  <!-- КОНТАКТЫ -->
  <section class="contacts" id="contacts">
    <div class="container contacts__inner">
      <div class="contacts__info">
        <img class="contacts__logo" src="img/logo-terra.png" alt="RUMA">
        <p class="contacts__line">Новый Хушет, ул. Садовая 62</p>
        <p class="contacts__line"><a href="tel:+79064501429">+7 906 450-14-29</a></p>
        <p class="contacts__line"><a href="https://instagram.com/ruma.coffeebar" target="_blank" rel="noopener">@ruma.coffeebar</a></p>
      </div>
      <div class="contacts__map">
        <iframe
          src="https://yandex.ru/map-widget/v1/?ll=47.553882%2C42.900879&z=16&mode=search&oid=74698574630&ol=biz"
          title="RUMA на карте" loading="lazy" allowfullscreen></iframe>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>© <span id="year"></span> RUMA — источник кофе</p>
  </footer>

  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
