name: Переход со старых ссылок
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node scripts/build-redirects.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
      - id: deploy
        uses: actions/deploy-pages@v4
